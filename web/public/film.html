<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="Kori in two minutes: a voice and text money coach for your own transactions." />
    <meta property="og:title" content="Kori: your balance is not your budget" />
    <meta property="og:type" content="video.other" />
    <meta property="og:image" content="/film-poster.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kori · the film</title>
    <style>
      :root {
        --ground: oklch(0.972 0.006 95);
        --line: oklch(0.905 0.009 95);
        --ink: oklch(0.22 0.02 160);
        --ink-2: oklch(0.4 0.018 160);
        --brand: oklch(0.42 0.095 158);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--ground); color: var(--ink); }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      }
      main { width: 100%; max-width: 1040px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 2px 18px; }
      .name { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 650; letter-spacing: -0.03em; color: var(--ink); text-decoration: none; }
      .open {
        display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 12px;
        background: var(--brand); color: white; font-size: 15px; font-weight: 600; text-decoration: none;
      }
      .open:hover { background: oklch(0.34 0.08 158); }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; border: 1px solid var(--line); background: var(--ground); }
      h1 { margin: 22px 2px 0; font-size: clamp(24px, 4.2vw, 34px); line-height: 1.12; letter-spacing: -0.03em; font-weight: 650; }
      p { margin: 8px 2px 0; font-size: 16px; line-height: 24px; color: var(--ink-2); max-width: 62ch; }
      p a { color: var(--ink); text-underline-offset: 3px; }
      :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="name" href="/" aria-label="Kori, open the app">
          <svg width="26" height="26" viewBox="0 0 20 20" aria-hidden="true">
            <rect x="3.5" y="9.3" width="3" height="7.7" rx="1.5" fill="oklch(0.42 0.095 158)" />
            <rect x="8.5" y="3" width="3" height="14" rx="1.5" fill="oklch(0.42 0.095 158)" />
            <rect x="13.5" y="11.1" width="3" height="5.9" rx="1.5" fill="oklch(0.42 0.095 158)" />
          </svg>
          Kori
        </a>
        <a class="open" href="/">Open the app</a>
      </header>
      <video controls playsinline preload="metadata" poster="/film-poster.jpg" src="/film.mp4"></video>
      <h1>Your balance is not your budget.</h1>
      <p>
        Kori is a voice and text money coach for your own transactions, made for the S-Pankki challenge at Junction 2026.
        Everything in the film is the live app, recorded at real speed.
        <a href="https://github.com/ToukoUrsin/kori">Source on GitHub</a>.
      </p>
    </main>
  </body>
</html>
