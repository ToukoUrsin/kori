app = "kori-coach"
primary_region = "iad"

[build]

# spoken audio (paid per character) and each visitor's pins and plan survive a deploy
[mounts]
  source = "kori_cache"
  destination = "/cache"

[env]
  KORI_AUDIO_DIR = "/cache/audio"
  KORI_STATE_DIR = "/cache/state"
  KORI_LAB_MEMORY_GB = "2"
  KORI_LAB_MAX_KERNELS = "6"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "8gb"
  cpu_kind = "performance"
  cpus = 4
