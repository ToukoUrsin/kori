[project]
name = "kori"
version = "0.1.0"
description = "Kori - a personal economic trainer that lets people talk with their own money"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "google-genai>=1.0",
  "httpx>=0.27",
  "pydantic>=2.8",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.33",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
